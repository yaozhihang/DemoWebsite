<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>3D Tiles Viewer (ArcGIS)</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.34/"></script>
    <style>
        html, body, #viewDiv {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
    </style>
</head>
<body>
<div id="viewDiv"></div>
<script>
    require([
        "esri/Map",
        "esri/views/SceneView",
        "esri/layers/IntegratedMesh3DTilesLayer"
    ], function (Map, SceneView, IntegratedMesh3DTilesLayer) {

        const map = new Map({
            basemap: "osm",
            ground: "world-elevation"
        });

        const view = new SceneView({
            container: "viewDiv",
            map: map
        });

        // ArcGIS Maps SDK for JavaScript 4.34 only ships
        // IntegratedMesh3DTilesLayer for OGC 3D Tiles. There is no
        // dedicated 3D-Object 3D Tiles layer in the JS SDK yet (unlike
        // the .NET/Java SDKs), so building tilesets must also be loaded
        // through this class. Picking/per-feature popups will be limited
        // compared to SceneLayer (I3S) — use the I3S export + arcgis.html
        // in the i3s/ folder if attribute popups are required.
        const tilesLayer = new IntegratedMesh3DTilesLayer({
            url: "./data/tileset.json",
            popupEnabled: true,
            outFields: ["*"]
        });
        map.add(tilesLayer);

        Promise.all([view.when(), tilesLayer.when()]).then(function () {
            return view.whenLayerView(tilesLayer);
        }).then(function () {
            const extent = tilesLayer.fullExtent;
            if (extent) {
                return view.goTo({ target: extent.expand(1.5), tilt: 60 });
            }
        }).catch(function (err) {
            // goTo animations reject with AbortError when the user interacts
            // with the view mid-fly — not an actual load failure.
            if (err && err.name === "AbortError") {
                return;
            }
            console.error("Failed to load 3D Tiles:", err);
        });
    });
</script>
</body>
</html>
