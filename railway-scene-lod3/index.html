<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>I3S Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
        .hover-toggle {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(38, 38, 38, 0.75);
            color: #edffff;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 13px;
            user-select: none;
        }
        .hover-toggle label { cursor: pointer; }
        .hover-toggle input { vertical-align: middle; margin-right: 6px; }
    </style>
</head>
<body>
<div id="cesiumContainer"></div>
<div class="hover-toggle">
    <label><input type="checkbox" id="hoverToggle" checked> Highlight on hover</label>
</div>
<script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: true,
        geocoder: false,
        timeline: true,
        animation: true,
        baseLayer: new Cesium.ImageryLayer(
            new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })
        ),
    });

    (async () => {
        try {
            const i3sProvider = await Cesium.I3SDataProvider.fromUrl("./data/layers/0", {
                traceFetches: false,
                showFeatures: true,
                // Required for per-feature-type styling alpha < 1: without
                // it, Cesium's I3SGeometry.js force-rewrites alphaMode=BLEND
                // back to OPAQUE on any primitive that wasn't split by the
                // worker, killing per-vertex transparency.
                adjustMaterialAlphaMode: true,
                // Cesium's I3SDataProvider auto-defaults calculateNormals to
                // true on Building Scene Layers and on any 3DObject layer
                // that lacks textureSetDefinitions (I3SDataProvider.js:381,
                // 394-399). With our default export (--enable-shading off),
                // the legacy buffer carries no NORMAL — but Cesium silently
                // generates flat normals on the client, undoing the unlit
                // intent. Pin to false so this flag's effect is visible
                // client-side too. Set to true only when you actually want
                // Cesium-side flat shading regardless of the export.
                calculateNormals: false,
                cesium3dTilesetOptions: {
                    // Mirror the 3D Tiles viewer's cache tuning — I3S in
                    // Cesium wraps a Cesium3DTileset under the hood, so
                    // the same knobs apply. Default 512 MB can be tight
                    // for the Munich/Berlin scenes with per-level split.
                    skipLevelOfDetail: true,
                    preloadWhenHidden: true,
                    preloadFlightDestinations: true,
                    cacheBytes: 2 * 1024 * 1024 * 1024,
                    maximumCacheOverflowBytes: 512 * 1024 * 1024,
                },
            });
            viewer.scene.primitives.add(i3sProvider);
            if (i3sProvider.extent) {
                viewer.camera.flyTo({ destination: i3sProvider.extent });
            }
            console.log("I3S loaded.");

            // DevTools helpers — after scene loads, each layer's
            // tileset is accessible for memory/perf diagnostics:
            //   i3sProvider.layers[0].tileset.totalMemoryUsageInBytes
            //   i3sProvider.layers[0].tileset.statistics.numberOfPendingRequests
            //   i3sProvider.layers[0].tileset.statistics.numberOfTilesUnloaded
            window.i3sProvider = i3sProvider;
        } catch (e) {
            console.error("Failed to load I3S:", e);
        }
    })();

    // Feature picking with highlight (following Cesium I3S Building Scene Layer pattern)
    const selected = {
        feature: undefined,
        originalColor: new Cesium.Color(),
    };
    const highlighted = {
        feature: undefined,
        originalColor: new Cesium.Color(),
    };
    const selectedEntity = new Cesium.Entity();

    function isI3sFeature(f) {
        return Cesium.defined(f)
            && Cesium.defined(f.content)
            && Cesium.defined(f.content.tile.i3sNode);
    }

    let hoverEnabled = true;
    document.getElementById("hoverToggle").addEventListener("change", function (e) {
        hoverEnabled = e.target.checked;
        if (!hoverEnabled && Cesium.defined(highlighted.feature)) {
            highlighted.feature.color = highlighted.originalColor;
            highlighted.feature = undefined;
        }
    });

    // Mouseover: green highlight (skipped on the currently click-selected feature)
    viewer.screenSpaceEventHandler.setInputAction(function (movement) {
        if (Cesium.defined(highlighted.feature)) {
            highlighted.feature.color = highlighted.originalColor;
            highlighted.feature = undefined;
        }
        if (!hoverEnabled) {
            return;
        }

        const pickedFeature = viewer.scene.pick(movement.endPosition);
        if (!isI3sFeature(pickedFeature)) {
            return;
        }
        if (pickedFeature === selected.feature) {
            return;
        }

        highlighted.feature = pickedFeature;
        Cesium.Color.clone(pickedFeature.color, highlighted.originalColor);
        pickedFeature.color = Cesium.Color.GREEN;
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    viewer.screenSpaceEventHandler.setInputAction(function (movement) {
        const pickedFeature = viewer.scene.pick(movement.position);
        if (selected.feature === pickedFeature) {
            return;
        }

        // Undo previous highlight
        if (Cesium.defined(selected.feature)) {
            selected.feature.color = selected.originalColor;
            selected.feature = undefined;
        }

        if (!isI3sFeature(pickedFeature)) {
            viewer.selectedEntity = undefined;
            return;
        }

        // If this feature is currently green-highlighted, drop the hover state
        // so we capture its real original color (not green) before turning it blue.
        if (pickedFeature === highlighted.feature) {
            pickedFeature.color = highlighted.originalColor;
            highlighted.feature = undefined;
        }

        // Highlight selected feature
        selected.feature = pickedFeature;
        Cesium.Color.clone(pickedFeature.color, selected.originalColor);
        pickedFeature.color = Cesium.Color.BLUE;

        // Show attributes
        const i3sNode = pickedFeature.content.tile.i3sNode;
        console.log("Picked featureId:", pickedFeature.featureId, "node:", i3sNode);
        i3sNode.loadFields().then(function () {
            console.log("Fields loaded, node.fields:", i3sNode.fields);
            const fields = i3sNode.getFieldsForFeature(pickedFeature.featureId);
            console.log("Fields for feature:", fields);
            let description = "No attributes";
            if (Object.keys(fields).length > 0) {
                description = '<table class="cesium-infoBox-defaultTable"><tbody>';
                for (const fieldName in fields) {
                    if (i3sNode.fields.hasOwnProperty(fieldName)) {
                        description += "<tr><th>" + fieldName + "</th><td>" + fields[fieldName] + "</td></tr>";
                    }
                }
                description += "</tbody></table>";
            }
            selectedEntity.name = fields["OBJECTID"] || "Feature";
            selectedEntity.description = description;
            viewer.selectedEntity = selectedEntity;
        }).catch(function (err) {
            console.error("loadFields failed:", err);
        });
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
</script>
</body>
</html>
