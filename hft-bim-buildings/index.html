<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>3D Tiles Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
        .hover-toggle {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(38, 38, 38, 0.75);
            color: #edffff;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 13px;
            user-select: none;
        }
        .hover-toggle label { cursor: pointer; }
        .hover-toggle input { vertical-align: middle; margin-right: 6px; }
    </style>
</head>
<body>
<div id="cesiumContainer"></div>
<div class="hover-toggle">
    <label><input type="checkbox" id="hoverToggle"> Highlight on hover</label>
</div>
<script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: true,
        geocoder: false,
        timeline: true,
        animation: true,
        baseLayer: new Cesium.ImageryLayer(
            new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })
        ),
    });

    (async () => {
        try {
            const tileset = await Cesium.Cesium3DTileset.fromUrl("./data/tileset.json", {
                showFeatures: true,
            });
            viewer.scene.primitives.add(tileset);
            viewer.flyTo(tileset);
            console.log("3D Tiles loaded.");
        } catch (e) {
            console.error("Failed to load 3D Tiles:", e);
        }
    })();

    // Feature picking with highlight
    const selected = {
        feature: undefined,
        originalColor: new Cesium.Color(),
    };
    const highlighted = {
        feature: undefined,
        originalColor: new Cesium.Color(),
    };
    const selectedEntity = new Cesium.Entity();

    let hoverEnabled = false;
    document.getElementById("hoverToggle").addEventListener("change", function (e) {
        hoverEnabled = e.target.checked;
        if (!hoverEnabled && Cesium.defined(highlighted.feature)) {
            highlighted.feature.color = highlighted.originalColor;
            highlighted.feature = undefined;
        }
    });

    // Mouseover: yellow highlight (skipped on the currently click-selected feature)
    viewer.screenSpaceEventHandler.setInputAction(function (movement) {
        if (Cesium.defined(highlighted.feature)) {
            highlighted.feature.color = highlighted.originalColor;
            highlighted.feature = undefined;
        }
        if (!hoverEnabled) {
            return;
        }

        const pickedFeature = viewer.scene.pick(movement.endPosition);
        if (!Cesium.defined(pickedFeature) || !Cesium.defined(pickedFeature.getProperty)) {
            return;
        }
        if (pickedFeature === selected.feature) {
            return;
        }

        highlighted.feature = pickedFeature;
        Cesium.Color.clone(pickedFeature.color, highlighted.originalColor);
        pickedFeature.color = Cesium.Color.GREEN;
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    viewer.screenSpaceEventHandler.setInputAction(function (movement) {
        const pickedFeature = viewer.scene.pick(movement.position);
        if (selected.feature === pickedFeature) {
            return;
        }

        // Undo previous highlight
        if (Cesium.defined(selected.feature)) {
            selected.feature.color = selected.originalColor;
            selected.feature = undefined;
        }

        if (!Cesium.defined(pickedFeature) || !Cesium.defined(pickedFeature.getProperty)) {
            viewer.selectedEntity = undefined;
            return;
        }

        // If this feature is currently yellow-highlighted, drop the hover state
        // so we capture its real original color (not yellow) before turning it blue.
        if (pickedFeature === highlighted.feature) {
            pickedFeature.color = highlighted.originalColor;
            highlighted.feature = undefined;
        }

        // Highlight selected feature
        selected.feature = pickedFeature;
        Cesium.Color.clone(pickedFeature.color, selected.originalColor);
        pickedFeature.color = Cesium.Color.BLUE;

        // Show attributes from EXT_structural_metadata property table
        const propertyIds = pickedFeature.getPropertyIds();
        console.log("Picked feature properties:", propertyIds);

        let description = "No attributes";
        if (propertyIds.length > 0) {
            description = '<table class="cesium-infoBox-defaultTable"><tbody>';
            for (const propId of propertyIds) {
                const value = pickedFeature.getProperty(propId);
                description += "<tr><th>" + propId + "</th><td>" + value + "</td></tr>";
            }
            description += "</tbody></table>";
        }

        const objectId = pickedFeature.getProperty("OBJECTID");
        selectedEntity.name = objectId || "Feature";
        selectedEntity.description = description;
        viewer.selectedEntity = selectedEntity;
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
</script>
</body>
</html>
